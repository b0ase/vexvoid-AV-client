# V3XV0ID mixer relay (vexvoid-AV-client-vx/relay, pm2 "vexvoid-mixer-relay" on 127.0.0.1:8101).
# claude.ai connector at https://mixer.vexvoid.com/mcp; mixers hold a long-lived SSE link at /device/link.
# TLS added afterwards by: sudo certbot --nginx -d mixer.vexvoid.com
server {
    listen 80;
    server_name mixer.vexvoid.com;
    client_max_body_size 10m;

    # the app's outbound link: server-sent events, kept open for hours
    location /device/link {
        proxy_pass http://127.0.0.1:8101;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    location / {
        proxy_pass http://127.0.0.1:8101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
